[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-coding-agent-ollama"
version = "0.1.0"
description = "Minimal standalone coding agent backed by Ollama"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mini-coding-agent = "mini_coding_agent:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.4",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.4",
]

[tool.setuptools]
packages = ["mini_coding_agent"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]


